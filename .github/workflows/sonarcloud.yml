name: Tests and SonarQube Cloud

on:
  push:
    branches:
      - main
      - sP3
  pull_request:
    branches:
      - main
      - sP3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-analyze:
    name: Tests and SonarQube Cloud analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: mejora-sjr-backend
        run: npm ci --ignore-scripts

      - name: Set up Firebase runtime
        working-directory: mejora-sjr-backend
        run: npm rebuild @firebase/util

      - name: Run backend AAA tests
        working-directory: mejora-sjr-backend
        run: npm run test:coverage

      - name: Install mobile dependencies
        working-directory: mejora-sjr-mobile
        run: npm ci --ignore-scripts

      - name: Set up esbuild binary
        working-directory: mejora-sjr-mobile
        run: npm rebuild esbuild

      - name: Check mobile TypeScript
        working-directory: mejora-sjr-mobile
        run: npm run typecheck

      - name: Validate SonarQube Cloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Add the SONAR_TOKEN secret in GitHub repository settings."
            exit 1
          fi
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::Add the SONAR_ORGANIZATION repository variable in GitHub settings."
            exit 1
          fi

      - name: Analyze with SonarQube Cloud and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  notify-email-on-failure:
    name: Notify by email on pipeline failure
    if: ${{ always() && needs.test-and-analyze.result == 'failure' }}
    needs: test-and-analyze
    runs-on: ubuntu-latest
    steps:
      - name: Validate email notification configuration
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CI_NOTIFICATION_EMAIL: ${{ vars.CI_NOTIFICATION_EMAIL }}
        run: |
          if [ -z "$GMAIL_USERNAME" ] || [ -z "$GMAIL_APP_PASSWORD" ] || [ -z "$CI_NOTIFICATION_EMAIL" ]; then
            echo "::error::Configure GMAIL_USERNAME and GMAIL_APP_PASSWORD secrets and the CI_NOTIFICATION_EMAIL variable."
            exit 1
          fi

      - name: Send failure notification by email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "CI pipeline failed: ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ vars.CI_NOTIFICATION_EMAIL }}
          from: "GitHub Actions CI <${{ secrets.GMAIL_USERNAME }}>"
          body: |
            The CI pipeline failed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
